name: MedSolution add contraceptive medication field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medsolution-contraceptive-medication.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create isolated branch
        run: |
          git config user.name "MedSolution Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git switch -c fix/contraceptive-medication-20260822

      - name: Apply targeted contraceptive medication field
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {found}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          html='pages/contraceptives.html'
          js='assets/js/contraceptives.js'

          # Modal field. Optional for backwards compatibility with existing records.
          replace_exact(html,
            '<label class="form-field"><span>Tipo de anticonceptivo *</span><select name="contraceptiveType" required><option value="">Seleccionar…</option><option value="Mensual">Mensual</option><option value="Trimestral">Trimestral</option></select></label>\n            <label class="form-field full-width" id="contraceptiveResponsibleField">',
            '<label class="form-field"><span>Tipo de anticonceptivo *</span><select name="contraceptiveType" required><option value="">Seleccionar…</option><option value="Mensual">Mensual</option><option value="Trimestral">Trimestral</option></select></label>\n            <label class="form-field"><span>Medicamento aplicado</span><input type="text" name="medication" maxlength="120" placeholder="Ej.: Medroxiprogesterona 150 mg" /></label>\n            <label class="form-field full-width" id="contraceptiveResponsibleField">')

          # Main table adds medication column.
          replace_exact(html,
            '<thead><tr><th>Paciente</th><th>Teléfono</th><th>Última aplicación</th><th>Próxima aplicación</th><th>Tipo</th><th>Responsable</th><th>Estado</th><th data-price-column>Precio</th><th>Acciones</th></tr></thead>',
            '<thead><tr><th>Paciente</th><th>Teléfono</th><th>Última aplicación</th><th>Próxima aplicación</th><th>Tipo</th><th>Medicamento</th><th>Responsable</th><th>Estado</th><th data-price-column>Precio</th><th>Acciones</th></tr></thead>')
          replace_exact(html,
            '<tbody id="controlTableBody"><tr><td colspan="9" class="control-empty">Cargando controles…</td></tr></tbody>',
            '<tbody id="controlTableBody"><tr><td colspan="10" class="control-empty">Cargando controles…</td></tr></tbody>')

          # History adds medication column.
          replace_exact(html,
            '<div class="control-history-scroll"><table class="control-table"><thead><tr><th>Aplicación</th><th>Tipo</th><th>Responsable</th><th>Próxima</th><th>Precio</th><th>Observaciones</th></tr></thead><tbody id="contraceptiveHistoryBody"></tbody></table></div>',
            '<div class="control-history-scroll"><table class="control-table"><thead><tr><th>Aplicación</th><th>Tipo</th><th>Medicamento</th><th>Responsable</th><th>Próxima</th><th>Precio</th><th>Observaciones</th></tr></thead><tbody id="contraceptiveHistoryBody"></tbody></table></div>')

          # Table empty colspan and medication cell.
          replace_exact(js,
            'body.innerHTML = `<tr><td colspan="${showPrice ? 9 : 8}" class="control-empty">No hay controles para los filtros seleccionados.</td></tr>`;',
            'body.innerHTML = `<tr><td colspan="${showPrice ? 10 : 9}" class="control-empty">No hay controles para los filtros seleccionados.</td></tr>`;')
          replace_exact(js,
            '        <td>${escapeControlHtml(record.contraceptiveType)}</td>\n        <td>${escapeControlHtml(record.procedureResponsible || \'—\')}</td>',
            '        <td>${escapeControlHtml(record.contraceptiveType)}</td>\n        <td>${escapeControlHtml(record.contraceptiveMedication || \'—\')}</td>\n        <td>${escapeControlHtml(record.procedureResponsible || \'—\')}</td>')

          # Editing preloads the stored medication.
          replace_exact(js,
            "  form.elements.contraceptiveType.value = record?.contraceptiveType || '';\n  form.elements.observations.value = record?.contraceptiveObservations || '';",
            "  form.elements.contraceptiveType.value = record?.contraceptiveType || '';\n  form.elements.medication.value = record?.contraceptiveMedication || '';\n  form.elements.observations.value = record?.contraceptiveObservations || '';")

          # Save medication in existing datos_clinicos JSON via saveAttention; no database schema change.
          replace_exact(js,
            '    contraceptiveType: type,\n    applicationDate,',
            "    contraceptiveType: type,\n    contraceptiveMedication: form.elements.medication.value.trim(),\n    applicationDate,",
            count=1)

          # Preserve medication metadata in the scheduled next dose as well.
          replace_exact(js,
            '    contraceptiveType: control.contraceptiveType,\n    applicationDate: control.applicationDate,',
            "    contraceptiveType: control.contraceptiveType,\n    contraceptiveMedication: control.contraceptiveMedication || '',\n    applicationDate: control.applicationDate,")

          # History shows medication and legacy records remain compatible.
          replace_exact(js,
            "? patientRecords.map((item) => `<tr><td>${formatControlDate(item.applicationDate)}</td><td>${escapeControlHtml(item.contraceptiveType)}</td><td>${escapeControlHtml(item.procedureResponsible || '—')}</td><td>${formatControlDate(item.nextApplicationDate)}</td><td>${Number(item.servicePrice || 0).toFixed(2)} Bs</td><td>${escapeControlHtml(item.contraceptiveObservations || '—')}</td></tr>`).join('')\n    : '<tr><td colspan=\"6\" class=\"control-empty\">Sin aplicaciones registradas.</td></tr>';",
            "? patientRecords.map((item) => `<tr><td>${formatControlDate(item.applicationDate)}</td><td>${escapeControlHtml(item.contraceptiveType)}</td><td>${escapeControlHtml(item.contraceptiveMedication || '—')}</td><td>${escapeControlHtml(item.procedureResponsible || '—')}</td><td>${formatControlDate(item.nextApplicationDate)}</td><td>${Number(item.servicePrice || 0).toFixed(2)} Bs</td><td>${escapeControlHtml(item.contraceptiveObservations || '—')}</td></tr>`).join('')\n    : '<tr><td colspan=\"7\" class=\"control-empty\">Sin aplicaciones registradas.</td></tr>';")

          print('Contraceptive medication field applied without schema changes.')
          PY

      - name: Validate JavaScript and exact scope
        run: |
          node --check assets/js/contraceptives.js
          grep -q 'name="medication"' pages/contraceptives.html
          grep -q 'contraceptiveMedication' assets/js/contraceptives.js
          grep -q '<th>Medicamento</th>' pages/contraceptives.html
          git diff --check
          git diff --stat

      - name: Commit isolated tested change
        run: |
          git add pages/contraceptives.html assets/js/contraceptives.js
          git commit -m "Add medication field to contraceptive applications"
          git push origin fix/contraceptive-medication-20260822
