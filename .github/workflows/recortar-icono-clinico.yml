name: Actualización puntual de iconos Registro Clínico
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recortar-icono-clinico.yml'
permissions:
  contents: write
jobs:
  iconos:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Instalar procesador de imágenes
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Recortar tarjeta blanca original y renovar recursos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image, ImageDraw, ImageFilter

          root = Path('.')
          source = Image.open(root/'assets/icons/icon-512x512.png').convert('RGBA')
          # El ícono aprobado ya está en GitHub. Solo se recorta el fondo EXTERIOR.
          # Coordenadas proporcionales de la tarjeta blanca con esquinas redondeadas.
          w, h = source.size
          side = min(w, h)
          left = round(w * .069)
          top = round(h * .069)
          right = round(w * .925)
          bottom = round(h * .925)
          raw = source.crop((left, top, right, bottom))
          sq = min(raw.size)
          cx, cy = raw.size[0]//2, raw.size[1]//2
          tile = raw.crop((cx-sq//2, cy-sq//2, cx-sq//2+sq, cy-sq//2+sq))
          alpha = Image.new('L', tile.size, 0)
          painter = ImageDraw.Draw(alpha)
          painter.rounded_rectangle((0,0,sq-1,sq-1),radius=round(sq*.205),fill=255)
          alpha=alpha.filter(ImageFilter.GaussianBlur(max(.7,sq/800)))
          tile.putalpha(alpha)
          assert tile.getpixel((0,0))[3] == 0, 'Borde exterior no transparente'
          assert tile.getpixel((sq//2,sq//2))[3] >= 250, 'Fondo interior perdido'
          assets = root/'assets/icons'
          for n in (16,32,48,72,96,144,180,192,512):
              image = tile.resize((n,n),Image.Resampling.LANCZOS)
              image.save(assets/f'icon-{n}x{n}.png',optimize=True)
              assert Image.open(assets/f'icon-{n}x{n}.png').size==(n,n)
          for n in (192,512):
              # Preservar los márgenes de seguridad de Android sin cambiar el dibujo.
              target=Image.new('RGBA',(n,n),(255,255,255,0))
              pad=round(n*.84)
              inner=tile.resize((pad,pad),Image.Resampling.LANCZOS)
              target.alpha_composite(inner,((n-pad)//2,(n-pad)//2))
              target.save(assets/f'icon-{n}x{n}-maskable.png',optimize=True)
          tile.resize((256,256),Image.Resampling.LANCZOS).save(
              assets/'favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48)])
          manifestPath=root/'manifest.json'
          manifest=json.loads(manifestPath.read_text())
          assert manifest['name']=='Registro Clínico' and manifest['short_name']=='Registro Clínico'
          old='rc-icon-20261102-v2'
          new='rc-icon-20261102-v3'
          def change_icon_url(s):
              assert old in s, 'Referencia esperada ausente'
              return s.replace(old,new)
          for icon in manifest['icons']: icon['src']=change_icon_url(icon['src'])
          for shortcut in manifest.get('shortcuts',[]):
              for icon in shortcut.get('icons',[]): icon['src']=change_icon_url(icon['src'])
          manifestPath.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          htmls = [root/'index.html', *sorted((root/'pages').glob('*.html'))]
          modified=0
          for path in htmls:
              text=path.read_text()
              if old in text:
                  path.write_text(text.replace(old,new))
                  modified+=1
          assert modified>=10, 'No se actualizaron los enlaces del icono en las pantallas'
          sw=root/'service-worker.js'
          s=sw.read_text()
          assert 'medsolution-pwa-v16' in s
          sw.write_text(s.replace('medsolution-pwa-v16','medsolution-pwa-v17').replace(old,new))
          test=root/'tests/auth-startup-screen.test.mjs'
          text=test.read_text()
          test.write_text(text.replace('medsolution-pwa-v16','medsolution-pwa-v17').replace(old,new))
          assert all(new in icon['src'] for icon in manifest['icons'])
          print('Aprobado: tarjeta blanca redondeada intacta; exterior transparente.')
          print('Iconos 16-512 px, maskable, favicon y manifest actualizados; 10 páginas.')
          PY
      - name: Pruebas de regresión disponibles
        run: |
          node --test tests/auth-startup-screen.test.mjs
          node --test tests/auth-session-persistence.test.mjs tests/patient-movements.test.js
      - name: Publicar únicamente los recursos del icono
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/ manifest.json service-worker.js index.html pages/ tests/auth-startup-screen.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "Sin cambios"; exit 1; }
          git commit -m "Recortar fondo exterior del icono aprobado Registro Clínico"
          git push origin HEAD:main
