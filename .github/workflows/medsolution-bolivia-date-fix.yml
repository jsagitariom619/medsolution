name: MedSolution Bolivia date correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medsolution-bolivia-date-fix.yml'

permissions:
  contents: write

jobs:
  prepare-date-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create isolated correction branch
        run: |
          git config user.name "MedSolution Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git switch -c fix/bolivia-dates-20260822

      - name: Correct only date-only values that incorrectly use UTC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"new Date\(\)\.toISOString\(\)\.slice\(0,\s*10\)")
          helper_marker = "window.MedSolutionDate.today"
          helper = r'''// MedSolution: fecha civil de Bolivia para campos YYYY-MM-DD.
          // Los timestamps absolutos continúan almacenándose en UTC/timestamptz.
          window.MedSolutionDate = window.MedSolutionDate || {};
          window.MedSolutionDate.today = window.MedSolutionDate.today || function medSolutionBoliviaToday(date = new Date()) {
            const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/La_Paz',
              year: 'numeric', month: '2-digit', day: '2-digit',
            }).formatToParts(date).map((part) => [part.type, part.value]));
            return `${parts.year}-${parts.month}-${parts.day}`;
          };'''

          changed = []
          for path in sorted(Path('.').glob('**/assets/js/*.js')):
            text = path.read_text(encoding='utf-8')
            if not pattern.search(text):
              continue
            updated = pattern.sub('window.MedSolutionDate.today()', text)
            if helper_marker not in updated.split('\n', 20)[0:20]:
              # Prepend once per independently loadable script. The helper is idempotent.
              updated = helper + '\n\n' + updated
            path.write_text(updated, encoding='utf-8')
            changed.append(str(path))

          if not changed:
            raise SystemExit('No date-only UTC patterns were found; refusing an empty change.')

          print('Changed files:')
          for item in changed:
            print(' -', item)
          PY

      - name: Verify JavaScript syntax
        run: |
          set -e
          for file in $(git diff --name-only -- '*.js'); do
            node --check "$file"
          done

      - name: Verify Bolivia boundary behavior
        run: |
          node <<'NODE'
          function boliviaToday(date) {
            const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/La_Paz', year: 'numeric', month: '2-digit', day: '2-digit',
            }).formatToParts(date).map((part) => [part.type, part.value]));
            return `${parts.year}-${parts.month}-${parts.day}`;
          }
          const cases = [
            ['2026-08-23T01:30:00Z', '2026-08-22'],
            ['2026-08-23T03:59:59Z', '2026-08-22'],
            ['2026-08-23T04:00:00Z', '2026-08-23'],
            ['2026-08-23T16:00:00Z', '2026-08-23'],
          ];
          for (const [input, expected] of cases) {
            const actual = boliviaToday(new Date(input));
            if (actual !== expected) throw new Error(`${input}: expected ${expected}, got ${actual}`);
          }
          console.log('Bolivia date boundary tests passed.');
          NODE

      - name: Verify risky UTC date-only pattern is gone from active JS trees
        run: |
          if grep -R -n -E 'new Date\(\)\.toISOString\(\)\.slice\(0,[[:space:]]*10\)' assets/js medsolution-main/assets/js; then
            echo 'Unsafe date-only UTC pattern remains.' >&2
            exit 1
          fi

      - name: Ensure changes are limited to JavaScript date handling
        run: |
          git diff --check
          git status --short
          test -n "$(git diff --name-only -- '*.js')"

      - name: Commit tested correction to isolated branch
        run: |
          git add assets/js medsolution-main/assets/js
          git commit -m "Fix Bolivia local dates without changing timestamps"
          git push origin fix/bolivia-dates-20260822
