name: MedSolution manual encrypted backup

on:
  workflow_dispatch:
    inputs:
      store_encrypted_artifact:
        description: Store the encrypted result as a one-day Actions artifact (may consume plan storage quota).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: medsolution-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main' && github.repository == 'jsagitariom619/medsolution' && github.actor == 'jsagitariom619'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Install PostgreSQL 17 tools and age
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age ca-certificates curl postgresql-client-17

      - name: Install pinned Supabase CLI and verify checksum
        run: |
          set -euo pipefail
          version='2.122.0'
          expected='59ed066847b98d7461c60e9109d40cab6b9756177ce06ebb05b51338519f5136'
          archive="$RUNNER_TEMP/supabase.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/supabase/cli/releases/download/v${version}/supabase_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$expected  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" supabase
          "$RUNNER_TEMP/supabase" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Export read-only database and Storage objects
        env:
          SUPABASE_DB_URL_RO: ${{ secrets.MEDSOLUTION_DB_URL_RO }}
          SUPABASE_URL: ${{ secrets.MEDSOLUTION_SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.MEDSOLUTION_SUPABASE_PUBLIC_KEY }}
        run: bash scripts/backup/export.sh "$RUNNER_TEMP/medsolution-backup"

      - name: Encrypt before creating any artifact
        id: encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.MEDSOLUTION_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [[ -n "${AGE_RECIPIENT:-}" ]] || { echo 'The protected age recipient secret is not configured.' >&2; exit 2; }
          archive="$RUNNER_TEMP/medsolution-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          encrypted="$archive.age"
          tar -C "$RUNNER_TEMP" -czf "$archive" medsolution-backup
          age --encrypt --recipient "$AGE_RECIPIENT" --output "$encrypted" "$archive"
          rm -f "$archive"
          sha256sum "$encrypted" > "$encrypted.sha256"
          echo "encrypted=$encrypted" >> "$GITHUB_OUTPUT"
          echo "checksum=$encrypted.sha256" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/medsolution-backup"

      - name: Upload encrypted artifact (opt-in; 1 day)
        if: ${{ inputs.store_encrypted_artifact }}
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4.6.2
        with:
          name: medsolution-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.encrypt.outputs.encrypted }}
            ${{ steps.encrypt.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report artifact intentionally not stored
        if: ${{ !inputs.store_encrypted_artifact }}
        run: echo 'Encrypted backup was created on the ephemeral runner and will be discarded. No artifact was uploaded.'

      - name: Remove encrypted temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/medsolution-backup" "$RUNNER_TEMP"/medsolution-backup-*.tar.gz "$RUNNER_TEMP"/medsolution-backup-*.tar.gz.age "$RUNNER_TEMP"/medsolution-backup-*.tar.gz.age.sha256
