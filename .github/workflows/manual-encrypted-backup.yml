name: MedSolution manual encrypted backup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run the connection-only preflight first. A backup requires explicit destination confirmation.
        required: true
        type: choice
        options:
          - preflight
          - backup
        default: preflight
      store_encrypted_artifact:
        description: Required for backup. Store the encrypted result as a one-day Actions artifact (may consume plan storage quota).
        required: true
        type: boolean
        default: false
      recoverable_destination_confirmed:
        description: Required for backup. Confirm you checked artifact quota/access and are ready to download and preserve the encrypted file before it expires.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: medsolution-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main' && github.repository == 'jsagitariom619/medsolution' && github.actor == 'jsagitariom619'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl postgresql-client-17

      - name: Prefer PostgreSQL 17 client binaries
        run: |
          set -euo pipefail
          [[ -x /usr/lib/postgresql/17/bin/pg_dump ]]
          [[ -x /usr/lib/postgresql/17/bin/psql ]]
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Verify PostgreSQL client version
        run: |
          set -euo pipefail
          [[ "$(command -v pg_dump)" == '/usr/lib/postgresql/17/bin/pg_dump' ]]
          [[ "$(command -v psql)" == '/usr/lib/postgresql/17/bin/psql' ]]
          pg_dump --version
          psql --version
          [[ "$(pg_dump --version | sed -E 's/.* ([0-9]+)\..*/\1/')" == '17' ]]
          [[ "$(psql --version | sed -E 's/.* ([0-9]+)\..*/\1/')" == '17' ]]

      - name: Preflight PostgreSQL connection and read-only export permissions
        env:
          SUPABASE_DB_URL_RO: ${{ secrets.MEDSOLUTION_DB_URL_RO }}
        run: bash scripts/backup/export.sh --preflight

      - name: Require a recoverable destination for full backup
        if: ${{ inputs.operation == 'backup' }}
        run: |
          set -euo pipefail
          if [[ '${{ inputs.store_encrypted_artifact }}' != 'true' || '${{ inputs.recoverable_destination_confirmed }}' != 'true' ]]; then
            echo 'Backup stopped: confirm artifact quota/access and a ready download-and-preservation destination, and enable encrypted artifact storage.' >&2
            exit 2
          fi

      - name: Install age for encrypted backup
        if: ${{ inputs.operation == 'backup' }}
        run: sudo apt-get install -y --no-install-recommends age

      - name: Export read-only database and Storage objects
        if: ${{ inputs.operation == 'backup' }}
        env:
          SUPABASE_DB_URL_RO: ${{ secrets.MEDSOLUTION_DB_URL_RO }}
          SUPABASE_URL: ${{ secrets.MEDSOLUTION_SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY: ${{ secrets.MEDSOLUTION_SUPABASE_PUBLIC_KEY }}
        run: bash scripts/backup/export.sh "$RUNNER_TEMP/medsolution-backup"

      - name: Encrypt before creating any artifact
        if: ${{ inputs.operation == 'backup' }}
        id: encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.MEDSOLUTION_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [[ -n "${AGE_RECIPIENT:-}" ]] || { echo 'The protected age recipient secret is not configured.' >&2; exit 2; }
          archive="$RUNNER_TEMP/medsolution-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          encrypted="$archive.age"
          tar -C "$RUNNER_TEMP" -czf "$archive" medsolution-backup
          age --encrypt --recipient "$AGE_RECIPIENT" --output "$encrypted" "$archive"
          rm -f "$archive"
          sha256sum "$encrypted" > "$encrypted.sha256"
          echo "encrypted=$encrypted" >> "$GITHUB_OUTPUT"
          echo "checksum=$encrypted.sha256" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/medsolution-backup"

      - name: Upload encrypted artifact (opt-in; 1 day)
        if: ${{ inputs.operation == 'backup' && inputs.store_encrypted_artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: medsolution-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.encrypt.outputs.encrypted }}
            ${{ steps.encrypt.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report preflight result
        if: ${{ inputs.operation == 'preflight' }}
        run: echo 'Connection-only preflight completed. No clinical rows or Storage objects were exported.'

      - name: Remove encrypted temporary files
        if: ${{ always() && inputs.operation == 'backup' }}
        run: rm -rf "$RUNNER_TEMP/medsolution-backup" "$RUNNER_TEMP"/medsolution-backup-*.tar.gz "$RUNNER_TEMP"/medsolution-backup-*.tar.gz.age "$RUNNER_TEMP"/medsolution-backup-*.tar.gz.age.sha256
