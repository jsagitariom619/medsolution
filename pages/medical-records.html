<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Med Solution — Historias clínicas y evolución de pacientes." />
    <title>Med Solution | Historias clínicas</title>
    <meta name="theme-color" content="#0F5F5C" />
    <link rel="manifest" href="../manifest.json" /><link rel="icon" href="../assets/icons/favicon.ico" sizes="any" /><link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32x32.png" /><link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/icon-16x16.png" /><link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/specialized-records.css" />
    <style>
      .records-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
      .records-sidebar-panel { position: sticky; top: calc(var(--topbar-height) + 16px); height: calc(100vh - var(--topbar-height) - 32px); min-height: 420px; }
      .records-sidebar-card{height:100%;display:flex;flex-direction:column;overflow:hidden}.records-sidebar-tools{flex:none}.records-search-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}.records-search-wrap{min-width:0}.records-search-wrap input { width: 100%; padding: 10px 14px; border: 1px solid var(--gray-200); border-radius: 12px; background: var(--gray-50); font-size: .93rem; outline: none; font-family: inherit; }
      .records-search-wrap input:focus,.records-search-wrap select:focus { border-color: var(--aqua); background: var(--white); box-shadow: 0 0 0 4px rgba(47,183,166,.14); }
      .records-patient-list { display: flex; flex-direction: column; gap: 4px; min-height:0; flex:1; overflow-y: auto; overscroll-behavior:contain; padding-right:4px; }
      .records-filter-control{position:relative}.records-filter-button{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--gray-200);border-radius:12px;background:var(--white);color:var(--petroleum);font-size:1rem;cursor:pointer}.records-filter-button:hover{border-color:var(--aqua);background:rgba(47,183,166,.08)}.records-order-menu{position:absolute;z-index:30;top:calc(100% + 8px);right:0;display:none;width:220px;padding:7px;border:1px solid var(--gray-200);border-radius:14px;background:var(--white);box-shadow:var(--shadow-lg)}.records-order-menu--open{display:grid}.records-order-option{padding:10px 12px;border:0;border-radius:9px;background:transparent;color:var(--gray-600);font:inherit;font-size:.8rem;text-align:left;cursor:pointer}.records-order-option:hover,.records-order-option--active{background:rgba(47,183,166,.12);color:var(--petroleum);font-weight:800}
      .records-patient-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: none; background: transparent; cursor: pointer; width: 100%; transition: background 140ms ease; }
      .records-patient-item:hover { background: var(--gray-100); }
      .records-patient-item--active { background: rgba(47,183,166,.12); }
      .records-patient-item--active strong { color: var(--petroleum); }
      .records-detail-panel { min-height: 200px; }
      .record-patient-header { display: flex; align-items: center; gap: 16px; padding: 20px; border-bottom: 1px solid var(--gray-200); flex-wrap: wrap; }
      .record-entries { padding: 20px 20px 20px 34px; display: grid; gap: 16px; position:relative; }
      .record-entries[data-record-panel="clinical"]::before{content:"";position:absolute;left:20px;top:62px;bottom:24px;width:2px;background:var(--gray-200)}
      .record-entry { border: 1px solid var(--gray-200); border-radius: var(--radius-md); overflow:visible;position:relative;background:white; }
      .record-entries[data-record-panel="clinical"] .record-entry::before{content:"";position:absolute;left:-21px;top:19px;width:12px;height:12px;border-radius:50%;background:var(--aqua);border:3px solid white;box-shadow:0 0 0 2px var(--gray-200)}
      .record-entry__header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--gray-50); border-bottom: 1px solid var(--gray-200); }
      .record-entry__date { font-weight: 700; color: var(--petroleum); font-size: .93rem; }
      .record-entry__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
      .record-field { padding: 12px 16px; border-bottom: 1px solid rgba(219,231,235,.6); }
      .record-field:nth-last-child(-n+2):not(:nth-child(odd)) { border-bottom: none; }
      .record-field:last-child { border-bottom: none; }
      .record-field span { display: block; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--gray-500); margin-bottom: 4px; }
      .record-field p { margin: 0; color: var(--gray-700); font-size: .9rem; line-height: 1.5; }
      .record-field--highlight { background: rgba(47,183,166,.06); }
      .record-field--highlight span { color: var(--aqua); }
      .record-field--full { grid-column: 1 / -1; }
      .record-field--vitals { grid-column: 1 / -1; }
      .vitals-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
      .vital-chip { padding: 5px 12px; border-radius: 999px; background: rgba(15,76,92,.08); color: var(--petroleum); font-weight: 700; font-size: .82rem; }
      .record-permanent{padding:22px}.record-permanent__head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.record-permanent__head h3{margin:5px 0;color:var(--petroleum-dark)}.record-permanent__head p{margin:0;color:var(--gray-500);font-size:.85rem}.record-permanent__grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record-permanent-field{padding:14px;border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50)}.record-permanent-field span{display:block;color:var(--gray-500);font-size:.7rem;font-weight:800;text-transform:uppercase}.record-permanent-field p{margin:6px 0 0;color:var(--gray-700);font-size:.87rem;line-height:1.5;white-space:pre-wrap}.record-modal{position:fixed;inset:0;z-index:2200;display:none;place-items:center;padding:20px}.record-modal.modal--open{display:grid}.record-modal__backdrop{position:absolute;inset:0;background:rgba(8,37,46,.62);backdrop-filter:blur(4px)}.record-modal__panel{position:relative;width:min(900px,94vw);max-height:90vh;overflow:auto;padding:24px;border-radius:18px;background:var(--white);box-shadow:var(--shadow-lg)}.record-modal__head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.record-modal__head h2{margin:0;color:var(--petroleum-dark)}.record-modal__close{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:var(--gray-100);color:var(--gray-600);cursor:pointer}.record-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.record-form-grid .full{grid-column:1/-1}.record-form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
      @media (max-width: 900px) { .records-layout { grid-template-columns: 1fr; } .records-sidebar-panel { position: static;height:auto;min-height:0 } .records-sidebar-card{height:auto}.records-patient-list { max-height: 300px;flex:none } }
      @media (max-width: 640px) { .record-entry__grid,.record-permanent__grid,.record-form-grid { grid-template-columns: 1fr; }.record-form-grid .full{grid-column:auto}.record-permanent__head{display:block}.record-permanent__head .btn{margin-top:12px} }
      /* Accordion for consultation entries */
      .record-entry--collapsed .record-entry__grid { display: none; }
      .record-entry__toggle { background: none; border: none; cursor: pointer; font-size: .85rem; color: var(--aqua); font-weight: 700; padding: 4px 10px; border-radius: 8px; transition: background 140ms; }
      .record-entry__toggle:hover { background: rgba(47,183,166,.12); }
      .record-entry--collapsed .record-entry__toggle-icon::before { content: '▶'; }
      .record-entry__toggle-icon::before { content: '▼'; }
      .record-tabs { display:flex;gap:8px;padding:18px 24px 0;border-top:1px solid var(--gray-200);flex-wrap:wrap; }
      .record-tab { border:1px solid var(--gray-200);background:var(--gray-50);color:var(--gray-600);padding:10px 16px;border-radius:12px;font:inherit;font-weight:800;cursor:pointer; }
      .record-tab--active { background:var(--petroleum);border-color:var(--petroleum);color:white; }
      .record-tab-panel[hidden] { display:none; }
      .record-attachments{grid-column:1/-1;padding:14px 16px;background:rgba(15,76,92,.035);border-top:1px solid var(--gray-200)}.record-attachments__list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}.record-attachment{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--gray-200);border-radius:12px;background:white;min-width:0}.record-attachment__preview{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--gray-100);display:grid;place-items:center;font-size:1.3rem;flex:none}.record-attachment__meta{min-width:0;flex:1}.record-attachment__meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}.record-attachment__meta small{color:var(--gray-500);font-size:.72rem}.record-attachment__actions{display:flex;gap:5px}.record-attachment__actions button,.record-attachment__actions a{border:0;background:transparent;color:var(--aqua);font-weight:800;cursor:pointer;text-decoration:none;padding:3px}
    </style>
  </head>
  <body class="app-body">
    <section class="content module-content-view">
          <div class="page-header">
            <div>
              <span class="eyebrow">Historias clínicas</span>
              <h1>Historias clínicas</h1>
              <p>Evolución clínica completa por paciente: signos vitales, diagnósticos y tratamientos.</p>
            </div>
            <a class="btn btn--primary" href="appointments.html">+ Nueva Atención</a>
          </div>

          <div class="records-layout">
            <!-- Patient list panel -->
            <div class="records-sidebar-panel">
              <article class="card records-sidebar-card" style="padding: 20px;">
                <h3 style="margin: 0 0 14px; color: var(--petroleum-dark); font-size: .95rem; font-weight: 800;">Pacientes</h3>
                <div class="records-sidebar-tools"><div class="records-search-row"><div class="records-search-wrap">
                  <input id="recordsPatientSearch" type="search" placeholder="Buscar nombre, CI o teléfono…" autocomplete="off" />
                </div>
                <div class="records-filter-control"><button class="records-filter-button" id="recordsFilterButton" type="button" title="Ordenar pacientes" aria-label="Filtros y ordenamiento">⌁</button><div class="records-order-menu" id="recordsOrderMenu"><button class="records-order-option" type="button" data-record-order="name-asc">Nombre A → Z</button><button class="records-order-option" type="button" data-record-order="name-desc">Nombre Z → A</button><button class="records-order-option" type="button" data-record-order="created">Fecha de creación</button><button class="records-order-option records-order-option--active" type="button" data-record-order="latest">Última atención</button></div></div></div></div>
                <div class="records-patient-list" id="recordsPatientList">
                  <p style="color:var(--gray-500)">Cargando…</p>
                </div>
              </article>
            </div>

            <!-- Detail panel -->
            <article class="card records-detail-panel" id="recordsDetailPanel">
              <!-- Populated by JS -->
            </article>
          </div>
    </section>
    <input id="clinicalAttachmentInput" type="file" multiple accept="image/*,application/pdf,.dcm,.dicom,.doc,.docx,.xls,.xlsx" hidden />
    <div class="record-modal" id="generalRecordModal" role="dialog" aria-modal="true" aria-labelledby="generalRecordModalTitle"><div class="record-modal__backdrop" data-close-general-record></div><section class="record-modal__panel"><header class="record-modal__head"><div><span class="eyebrow">Historia Clínica General</span><h2 id="generalRecordModalTitle">Editar información permanente</h2></div><button class="record-modal__close" type="button" data-close-general-record aria-label="Cerrar">✕</button></header><form id="generalRecordForm"><div class="record-form-grid"><label class="form-field"><span>Grupo sanguíneo</span><input name="bloodGroup" type="text" /></label><label class="form-field full"><span>Antecedentes personales</span><textarea name="personalHistory" rows="3"></textarea></label><label class="form-field full"><span>Antecedentes familiares</span><textarea name="familyHistory" rows="3"></textarea></label><label class="form-field full"><span>Alergias</span><textarea name="allergicHistory" rows="3"></textarea></label><label class="form-field full"><span>Enfermedades previas o crónicas</span><textarea name="chronicDiseases" rows="3"></textarea></label><label class="form-field full"><span>Cirugías</span><textarea name="surgicalHistory" rows="3"></textarea></label><label class="form-field full"><span>Hábitos</span><textarea name="habits" rows="3"></textarea></label><label class="form-field full"><span>Medicación habitual</span><textarea name="currentMedications" rows="3"></textarea></label><label class="form-field full"><span>Hospitalizaciones</span><textarea name="hospitalizations" rows="3"></textarea></label><label class="form-field full"><span>Antecedentes gineco-obstétricos</span><textarea name="gynecologicalHistory" rows="3"></textarea></label><label class="form-field full"><span>Inmunizaciones</span><textarea name="immunizations" rows="3"></textarea></label><label class="form-field full"><span>Historia de la enfermedad / notas permanentes</span><textarea name="notes" rows="4"></textarea></label></div><div class="record-form-actions"><button class="btn btn--secondary" type="button" data-close-general-record>Cancelar</button><button class="btn btn--primary" type="submit">Guardar información</button></div></form></section></div>

    <script src="../assets/vendor/supabase.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/pwa.js"></script>
    <script type="module" src="../assets/js/main.js?v=20260731-master-layout"></script>
    <script src="../assets/js/specialized-records.js?v=20260805-specialized-records"></script>
    <script src="../assets/js/medical-records.js?v=20260805-specialized-records"></script>
  </body>
</html>
