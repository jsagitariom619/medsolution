<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Med Solution, plataforma profesional para consultorios médicos." />
    <title>Med Solution | Pacientes</title>
    <meta name="theme-color" content="#0F5F5C" />
    <link rel="manifest" href="../manifest.json" /><link rel="icon" href="../assets/icons/favicon.ico" sizes="any" /><link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32x32.png" /><link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/icon-16x16.png" /><link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <style>
      .patients-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .patients-count { font-size: .88rem; color: var(--gray-500); margin-left: auto; }
      .patients-table-wrap { overflow-x: auto; margin-top: 20px; }
      .patients-table { width: 100%; border-collapse: collapse; font-size: .93rem; }
      .patients-table th { text-align: left; padding: 12px 16px; background: var(--gray-50); color: var(--gray-500); font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid var(--gray-200); }
      .patients-table td { padding: 14px 16px; border-bottom: 1px solid var(--gray-200); vertical-align: middle; }
      .patients-table tr:last-child td { border-bottom: none; }
      .patients-table tr[data-patient-row]:hover td { background: var(--gray-50); }
      .patient-cell { display: flex; align-items: center; gap: 12px; }
      .patient-cell strong { display: block; font-weight: 600; color: var(--gray-700); }
      .patient-cell small { color: var(--gray-500); font-size: .82rem; }
      .action-links { display: flex; gap: 6px; }
      .patients-empty { text-align: center; padding: 40px; color: var(--gray-500); }
      .patients-search { flex: 1; min-width: 200px; max-width: 360px; }
      .patients-search input { width: 100%; padding: 10px 14px; border: 1px solid var(--gray-200); border-radius: 12px; background: var(--gray-50); font-size: .93rem; outline: none; }
      .patients-search input:focus { border-color: var(--aqua); background: var(--white); box-shadow: 0 0 0 4px rgba(47,183,166,.14); }
      .patient-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .patient-form-grid .full-width { grid-column: 1 / -1; }
      .form-field select { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-200); border-radius: 12px; background: var(--gray-50); font-size: .93rem; font-family: inherit; outline: none; color: var(--gray-700); }
      .form-field select:focus { border-color: var(--aqua); background: var(--white); box-shadow: 0 0 0 4px rgba(47,183,166,.14); }
      @media (max-width: 640px) { .patient-form-grid { grid-template-columns: 1fr; } .patient-form-grid .full-width { grid-column: 1; } }
    </style>
  </head>
  <body class="app-body">
    <section class="content module-content-view">
          <div class="page-header">
            <div>
              <span class="eyebrow">Pacientes</span>
              <h1>Gestión de pacientes</h1>
              <p>Registro, búsqueda, edición y seguimiento de pacientes del consultorio.</p>
            </div>
            <button class="btn btn--primary" id="newPatientBtn" type="button" data-requires-role="Administrador,Médico,Auxiliar">+ Nuevo Paciente</button>
          </div>

          <article class="card" style="padding: 24px;">
            <div class="patients-toolbar">
              <div class="patients-search">
                <input id="patientSearch" type="search" placeholder="Buscar por nombre o teléfono…" />
              </div>
              <input id="patientRegistrationDate" type="date" title="Filtrar por fecha de registro" style="padding:10px 14px;border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50)" />
              <select id="patientSort" title="Ordenar pacientes" style="padding:10px 14px;border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50)"><option value="az">A-Z</option><option value="za">Z-A</option><option value="recent">Más recientes</option><option value="oldest">Más antiguos</option></select>
              <span class="patients-count" id="patientsCount"></span>
            </div>
            <div class="patients-table-wrap">
              <table class="patients-table">
                <thead>
                  <tr>
                    <th>Paciente</th>
                    <th>Género</th>
                    <th>Nacimiento</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Registrado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="patientsTableBody">
                  <tr id="patientsEmptyRow" style="display:none;">
                    <td colspan="7" class="patients-empty">No se encontraron pacientes.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </article>
    </section>

    <!-- Patient Modal -->
    <div class="nursing-modal" id="patientModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="nursing-modal__overlay"></div>
      <div class="nursing-modal__content">
        <div class="nursing-modal__header">
          <h2 id="modalTitle">Nuevo Paciente</h2>
          <button class="nursing-modal__close" id="closeModalBtn" type="button" aria-label="Cerrar">✕</button>
        </div>
        <form class="nursing-form" id="patientForm" novalidate>
          <div class="patient-form-grid">
            <label class="form-field">
              <span>Nombre *</span>
              <input type="text" name="nombre" placeholder="Ej. María Fernanda" required />
            </label>
            <label class="form-field">
              <span>Apellido *</span>
              <input type="text" name="apellido" placeholder="Ej. López" required />
            </label>
            <label class="form-field">
              <span>Cédula de identidad</span>
              <input type="text" name="ci" placeholder="Opcional" />
            </label>
            <label class="form-field">
              <span>Fecha de nacimiento</span>
              <input type="date" name="fechaNacimiento" />
            </label>
            <label class="form-field">
              <span>Género</span>
              <select name="genero">
                <option value="">Seleccionar…</option>
                <option value="Femenino">Femenino</option>
                <option value="Masculino">Masculino</option>
                <option value="Otro">Otro</option>
              </select>
            </label>
            <label class="form-field">
              <span>Teléfono</span>
              <input type="tel" name="telefono" placeholder="Ej. 0412-5551234" />
            </label>
            <label class="form-field">
              <span>Correo electrónico</span>
              <input type="email" name="email" placeholder="Ej. paciente@email.com" />
            </label>
            <label class="form-field full-width">
              <span>Dirección</span>
              <input type="text" name="direccion" placeholder="Ej. Av. Principal, Caracas" />
            </label>
          </div>
          <div class="nursing-form__actions">
            <button class="btn btn--secondary" id="cancelModalBtn" type="button">Cancelar</button>
            <button class="btn btn--primary" id="modalSaveBtn" type="submit">Guardar</button>
          </div>
          <p id="patientFormStatus" role="status" style="display:none;margin:10px 0 0;font-size:.88rem"></p>
        </form>
      </div>
    </div>

    <script src="../assets/vendor/supabase.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/pwa.js"></script>
    <script type="module" src="../assets/js/main.js?v=20260731-master-layout"></script>
    <script src="../assets/js/patients.js"></script>
  </body>
</html>
