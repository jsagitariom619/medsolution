<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Med Solution — Agenda médica del consultorio." />
    <title>Med Solution | Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <style>
      .schedule-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .schedule-count { font-size: .88rem; color: var(--gray-500); margin-left: auto; }
      .schedule-table-wrap { overflow-x: auto; margin-top: 20px; }
      .schedule-table { width: 100%; border-collapse: collapse; font-size: .93rem; }
      .schedule-table th { text-align: left; padding: 12px 16px; background: var(--gray-50); color: var(--gray-500); font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid var(--gray-200); }
      .schedule-table td { padding: 14px 16px; border-bottom: 1px solid var(--gray-200); vertical-align: middle; }
      .schedule-table tr:last-child td { border-bottom: none; }
      .schedule-table tr[data-appt-row]:hover td { background: var(--gray-50); }
      .schedule-filter { padding: 10px 14px; border: 1px solid var(--gray-200); border-radius: 12px; background: var(--gray-50); font-size: .93rem; font-family: inherit; outline: none; color: var(--gray-700); }
      .schedule-filter:focus { border-color: var(--aqua); background: var(--white); box-shadow: 0 0 0 4px rgba(47,183,166,.14); }
      .schedule-filter-wrap { flex: 1; min-width: 140px; }
      .patient-cell { display: flex; align-items: center; gap: 10px; }
      .schedule-empty { text-align: center; padding: 40px; color: var(--gray-500); }
      .badge--confirmed { background: rgba(47,183,166,.14); color: var(--petroleum); }
      .badge--programmed { background:rgba(40,111,178,.14);color:#286fb2 }.badge--pending { background: rgba(40,111,178,.14); color:#286fb2; }
      .badge--rescheduled { background:rgba(255,183,77,.18);color:#b45309 }.badge--attended { background: rgba(100,116,139,.15); color:#475569; }
      .badge--cancelled { background: rgba(239,61,89,.12); color: #c93047; }
      .appt-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .appt-form-grid .full-width { grid-column: 1 / -1; }
      .form-field select { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-200); border-radius: 12px; background: var(--gray-50); font-size: .93rem; font-family: inherit; outline: none; color: var(--gray-700); }
      .form-field select:focus { border-color: var(--aqua); background: var(--white); box-shadow: 0 0 0 4px rgba(47,183,166,.14); }
      .calendar-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.calendar-view-buttons{display:flex;gap:6px}.calendar-view-buttons button.active{color:#fff;background:var(--petroleum)}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--gray-200);border-radius:16px;overflow:hidden;margin-bottom:22px}.calendar-day{min-height:120px;padding:9px;border-right:1px solid var(--gray-100);border-bottom:1px solid var(--gray-100);background:#fff}.calendar-day--outside{background:var(--gray-50);opacity:.7}.calendar-day--today{box-shadow:inset 0 0 0 2px var(--aqua)}.calendar-day>strong{display:block;margin-bottom:7px;color:var(--petroleum-dark)}.calendar-event{display:block;margin:4px 0;padding:5px 7px;border-left:4px solid #286fb2;border-radius:7px;background:rgba(40,111,178,.1);font-size:.72rem;overflow:hidden}.calendar-event--Confirmada{border-color:#22a06b;background:rgba(34,160,107,.1)}.calendar-event--Reprogramada{border-color:#f59e0b;background:rgba(245,158,11,.1)}.calendar-event--Cancelada{border-color:#ef3d59;background:rgba(239,61,89,.09)}.calendar-event--Atendida{border-color:#64748b;background:rgba(100,116,139,.1)}.calendar-day-head{padding:9px;text-align:center;background:var(--gray-50);color:var(--gray-500);font-weight:800;font-size:.78rem}.calendar-grid--day,.calendar-grid--week{grid-template-columns:repeat(var(--calendar-columns),1fr)}
      @media (max-width: 640px) { .appt-form-grid { grid-template-columns: 1fr; } .appt-form-grid .full-width { grid-column: 1; } }
    </style>
  </head>
  <body class="app-body">
    <div class="app-shell">
      <main class="main-area">
        <section class="content">
          <div class="page-header">
            <div>
              <span class="eyebrow">Agenda</span>
              <h1>Agenda médica</h1>
              <p>Programa, confirma y gestiona las citas del consultorio.</p>
            </div>
            <button class="btn btn--primary" id="newApptBtn" type="button">+ Nueva Cita</button>
          </div>

          <article class="card" style="padding: 24px;">
            <div class="calendar-controls"><div><button class="btn btn--secondary" id="previousCalendarBtn" type="button">‹</button> <button class="btn btn--secondary" id="todayCalendarBtn" type="button">Hoy</button> <button class="btn btn--secondary" id="nextCalendarBtn" type="button">›</button></div><strong id="calendarPeriodLabel"></strong><div class="calendar-view-buttons"><button class="btn btn--secondary" data-calendar-view="day" type="button">Día</button><button class="btn btn--secondary" data-calendar-view="week" type="button">Semana</button><button class="btn btn--secondary active" data-calendar-view="month" type="button">Mes</button></div></div>
            <div class="calendar-grid" id="scheduleCalendar"></div>
            <div class="schedule-toolbar">
              <div class="schedule-filter-wrap">
                <input class="schedule-filter" id="filterDate" type="date" title="Filtrar por fecha" />
              </div>
              <div class="schedule-filter-wrap">
                <input class="schedule-filter" id="filterPatient" type="text" placeholder="Buscar paciente…" />
              </div>
              <div class="schedule-filter-wrap">
                <select class="schedule-filter" id="filterStatus">
                  <option value="">Todos los estados</option>
                  <option>Programada</option>
                  <option>Confirmada</option>
                  <option>Reprogramada</option>
                  <option>Atendida</option>
                  <option>Cancelada</option>
                </select>
              </div>
              <div class="schedule-filter-wrap"><select class="schedule-filter" id="filterTiming"><option value="">Todas las fechas</option><option value="upcoming">Próximas</option><option value="expired">Vencidas</option></select></div>
              <span class="schedule-count" id="scheduleCount"></span>
            </div>
            <div class="schedule-table-wrap">
              <table class="schedule-table">
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Paciente</th>
                    <th>Servicio / profesional</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="scheduleTableBody">
                  <tr id="scheduleEmptyRow" style="display:none;">
                    <td colspan="6" class="schedule-empty">No se encontraron citas.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </article>
        </section>
      </main>
    </div>

    <!-- Schedule Modal -->
    <div class="nursing-modal" id="scheduleModal" role="dialog" aria-modal="true" aria-labelledby="scheduleModalTitle">
      <div class="nursing-modal__overlay"></div>
      <div class="nursing-modal__content">
        <div class="nursing-modal__header">
          <h2 id="scheduleModalTitle">Nueva Cita</h2>
          <button class="nursing-modal__close" id="closeScheduleModalBtn" type="button" aria-label="Cerrar">✕</button>
        </div>
        <form class="nursing-form" id="scheduleForm" novalidate>
          <div class="appt-form-grid">
            <label class="form-field full-width">
              <span>Paciente *</span>
              <select id="apptPatientSelect" name="patient" required>
                <option value="">Seleccionar paciente…</option>
              </select>
            </label>
            <label class="form-field">
              <span>Fecha *</span>
              <input type="date" name="date" required />
            </label>
            <label class="form-field">
              <span>Hora *</span>
              <input type="time" name="time" required />
            </label>
            <label class="form-field full-width">
              <span>Servicio *</span><select name="serviceId" id="scheduleServiceSelect" required><option value="">Seleccionar servicio…</option></select>
            </label>
            <label class="form-field full-width"><span>Profesional *</span><select name="professional" id="scheduleProfessionalSelect" required><option value="">Seleccionar profesional…</option></select></label>
            <label class="form-field full-width"><span>Observaciones</span><textarea name="observations" rows="3" placeholder="Observaciones de la cita…"></textarea></label>
            <label class="form-field">
              <span>Estado</span>
              <select name="status">
                <option value="Programada">Programada</option>
                <option value="Confirmada">Confirmada</option>
                <option value="Reprogramada">Reprogramada</option>
                <option value="Atendida">Atendida</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </label>
          </div>
          <div class="nursing-form__actions">
            <button class="btn btn--secondary" id="cancelScheduleModalBtn" type="button">Cancelar</button>
            <button class="btn btn--primary" type="submit">Guardar Cita</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../assets/vendor/supabase.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script src="../assets/js/schedule.js"></script>
  </body>
</html>
